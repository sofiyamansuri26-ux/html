
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
</head>

<body>

    <header>
        <h1>Feedback</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="Course.html">Courses</a></li>
                <li><a href="Feedback.html">Feedback</a></li>
                <li><a href="Grades.html">Grades</a></li>
                <li><a href="Contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>

        <h2>Feedback Form</h2>

        <form>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <br><br>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone">

            <br><br>

            <label for="course">Course:</label>

            <select id="course" name="course">
                <option value="">Select Course</option>
                <option value="bca">BCA</option>
                <option value="bba">BBA</option>
                <option value="bcom">B.Com</option>
            </select>

            <br><br>

            <p>How do you rate this portal?</p>

            <input type="radio" id="excellent" name="rating" value="excellent">
            <label for="excellent">Excellent</label>

            <input type="radio" id="good" name="rating" value="good">
            <label for="good">Good</label>

            <input type="radio" id="average" name="rating" value="average">
            <label for="average">Average</label>

            <br><br>

            <p>What did you like?</p>

            <input type="checkbox" id="profile" name="liked" value="profile">
            <label for="profile">Profile</label>

            <input type="checkbox" id="courses" name="liked" value="courses">
            <label for="courses">Courses</label>

            <input type="checkbox" id="grades" name="liked" value="grades">
            <label for="grades">Grades</label>

            <br><br>

            <label for="message">Your Feedback:</label>
            <br>
            <textarea id="message" name="message" rows="5" cols="40"
                placeholder="Write your feedback here"></textarea>

            <br><br>

            <button type="submit">Submit Feedback</button>
            <button type="reset">Reset</button>

        </form>

    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Student Profile &amp; Course Portal</p>
    </footer>

</body>

</html>
